<!doctype html><html><head><meta charset="utf-8"><title>Repurpose AI</title><style>
body{font:15px system-ui;max-width:720px;margin:40px auto;padding:0 16px}textarea{width:100%;height:200px}
button{padding:10px 18px;margin:8px 0}pre{white-space:pre-wrap;background:#f5f5f5;padding:12px}
</style></head><body>
<h1>Turn one post into a week of content</h1>
<textarea id="t" placeholder="Paste a blog post, transcript, or notes"></textarea>
<button id="go">Repurpose</button> <span id="left"></span>
<pre id="out"></pre>
<script>
const CHECKOUT = "https://YOURSTORE.lemonsqueezy.com/buy/YOUR-PRODUCT", FREE = 3;
const used = () => +localStorage.uses || 0;
const show = () => left.textContent = localStorage.pro ? "Pro" : `${Math.max(0, FREE - used())} free uses left`;
go.onclick = async () => {
  if (!localStorage.pro && used() >= FREE) return location.href = CHECKOUT;
  out.textContent = "Working...";
  const r = await fetch("/api/repurpose", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: t.value }) });
  out.textContent = (await r.json()).output || "Error";
  localStorage.uses = used() + 1; show();
};
show();
</script></body></html>
